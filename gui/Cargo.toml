[package]
name = "nzxt-ctl-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
cxx = "1"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["qt_full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.3"
anyhow = "1"

[build-dependencies]
cxx-qt-build = { version = "0.9", features = ["link_qt_object_files"] }

[[bin]]
name = "nzxt-ctl-gui"
path = "src/main.rs"

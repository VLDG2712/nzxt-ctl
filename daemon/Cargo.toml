[package]
name = "nzxt-ctl-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
nzxt-ctl-common = { path = "../common" }
anyhow = "1"
env_logger = "0.11"
log = "0.4"
ctrlc = "3"
serde_json = "1"
nix = { version = "0.31.3", features = ["user", "fs"] }
nusb = "0.2.7"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ab_glyph = "0.2.32"
imageproc = "0.27.0"
